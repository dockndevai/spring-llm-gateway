# Publishes spring-llm-gateway-core to Maven Central.
#
# Triggered by pushing a tag like v0.1.0. The upload is staged rather than released:
# autoPublish is false in the release profile, so the final "publish" is a deliberate
# click in the Central portal. A published version can never be deleted.
#
# Required repository secrets:
#   MAVEN_GPG_PRIVATE_KEY   armoured private key  (gpg --armor --export-secret-keys <KEY_ID>)
#   MAVEN_GPG_PASSPHRASE    passphrase for that key
#   CENTRAL_TOKEN_USERNAME  user token name from central.sonatype.com
#   CENTRAL_TOKEN_PASSWORD  user token password
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          # Wires settings.xml for the Central portal and imports the signing key.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify
        run: mvn -B clean verify

      - name: Publish to Maven Central
        run: mvn -B -Prelease deploy -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
